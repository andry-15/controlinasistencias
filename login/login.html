<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"rel="stylesheet">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <main class="login-container">
        <section class="login-card">
            <a href="../index.html" class="btn-home" title="Volver al inicio">
                <i class="fa-solid fa-house"></i></a>
            <!-- Logo -->
            <div class="logo">
                <img src="img/logo.png" alt="Logo Control Inasistencia">
            </div>
            <!-- Título -->
            <h1>Bienvenido</h1>
            <p class="subtitle">
                Inicia sesión en Control Inasistencia
            </p>
            <!-- Formulario -->
            <form id="loginForm">
                <div class="input-group">
                    <label for="usuario">Usuario o correo</label>
                    <input
                        type="text"
                        id="usuario"
                        placeholder="Ingresa tu usuario" required>
                </div>
            <!--contraseña-->
            <div class="input-group">

                <label for="password">
                    Contraseña
                </label>
            
                <div class="password-container">
                    <input type="password" id="password"
                        placeholder="Ingresa tu contraseña" required>
            
                    <span class="eye" id="togglePassword">
                        <i class="fa-solid fa-eye"></i>
                    </span>
                </div>
            </div>

            <!--recuperar contraseña-->
                <div class="forgot">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>
                <button type="submit">
                    Iniciar Sesión
                </button>
            </form>
            <div class="register">
                <p>
                    ¿No tienes una cuenta?
                    <a href="../registro/registro.html">Regístrate</a>
                </p>
            </div>
        </section>
    </main>
    <script src="login.js"></script>

</body>
</html>
