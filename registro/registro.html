<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Control Asistencial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"rel="stylesheet">
    <title>registro</title>
    <link rel="stylesheet" href="registro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <main class="register-container">
        <section class="register-card">
            <a href="../index.html" class="btn-home" title="Volver al inicio">
                <i class="fa-solid fa-house"></i></a>
            <!-- Logo -->
            <div class="logo">
                <img src="img/logo.png" alt="Logo Control Asistencial">
            </div>
            <h1>Crear cuenta</h1>
            <p class="subtitle">
                Regístrate en Control de Inasistencial
            </p>
            <form id="registerForm">
                <!-- Nombre -->
                <div class="input-group">
                    <label for="nombre">
                        Nombre completo
                    </label>
                    <input
                        type="text"
                        id="nombre"
                        placeholder="Ingresa tu nombre completo"
                        required
                    >
                </div>
                <!-- Correo -->
                <div class="input-group">
                    <label for="correo">
                        Correo electrónico
                    </label>
                    <input
                        type="email"
                        id="correo"
                        placeholder="ejemplo@correo.com"
                        required
                    >
                </div>
                <!-- Documento -->
                <div class="input-group">
                    <label for="documento">
                        Número de documento
                    </label>
                    <input
                        type="number"
                        id="documento"
                        placeholder="Ingresa tu documento"
                        required
                    >
                </div>
                <!-- Tipo de usuario -->
                <div class="input-group">
                    <label for="tipoUsuario">
                        Tipo de usuario
                    </label>
                    <select id="tipoUsuario" required>
                        <option value="">
                            Selecciona una opción
                        </option>
                        <option value="administrador">
                            Administrador
                        </option>
                        <option value="docente">
                            Docente
                        </option>
                        <option value="estudiante">
                            Estudiante
                        </option>
                    </select>
                </div>
                <!-- Contraseña -->
                <div class="input-group">
                    <label for="password">
                        Contraseña
                    </label>
                    <div class="password-container">
                        <input
                            type="password"
                            id="password"
                            placeholder="Crea una contraseña"
                            required
                        >
                        <span
                            class="eye"
                            id="togglePassword"
                        >
                        <i class="fa-solid fa-eye"></i>
                        </span>
                    </div>
                </div>
                <!-- Botón -->
                <button type="submit">
                    Registrarse
                </button>
            </form>
            <!-- Volver al login -->
            <div class="login-link">
                <p>
                    ¿Ya tienes una cuenta?
                    <a href="../login/login.html">Inicia sesión </a>
                </p>
            </div>
        </section>
    </main>
    <script src="registro.js"></script>

</body>

</html>
